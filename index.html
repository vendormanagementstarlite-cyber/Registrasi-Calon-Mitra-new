<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrasi Mitra/Vendor Baru</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1f2933; --muted:#5f6c7b; --line:#d5dbe1; --accent:#0b5cad; --err:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--text);
    background-color:#eef4fa;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'><g fill='none' stroke='%230b5cad' stroke-opacity='.13' stroke-width='1.2'><path d='M0 40 L70 80 L140 30 L260 90'/><path d='M70 80 L90 170 L190 150 L260 220'/><path d='M140 30 L190 150'/><path d='M90 170 L30 240 L0 220'/><path d='M190 150 L170 260'/></g><g fill='%230b5cad' fill-opacity='.22'><circle cx='70' cy='80' r='3.5'/><circle cx='140' cy='30' r='3'/><circle cx='90' cy='170' r='3.5'/><circle cx='190' cy='150' r='3.5'/><circle cx='30' cy='240' r='2.5'/><circle cx='260' cy='90' r='2.5'/></g></svg>"),
      linear-gradient(180deg,#e8f1fa,#f6f9fc);
    background-attachment: fixed; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { background:#fff; color:#1f2933; border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:10px; padding:20px; margin-bottom:16px; display:flex; align-items:center; gap:18px; box-shadow:0 2px 10px rgba(11,61,110,.06); }
  header img { height:84px; width:auto; flex:none; }
  header h1 { margin:0 0 6px; font-size:1.35rem; color:#0b3d6e; }
  header p { margin:0; color:#5f6c7b; font-size:.9rem; }
  @media (max-width:520px) { header { flex-direction:column; text-align:center; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(11,61,110,.05); }
  section h2 { margin:0 0 4px; font-size:1.1rem; color:var(--accent); }
  .desc { color:var(--muted); font-size:.88rem; margin:0 0 12px; }
  .field { margin:14px 0; }
  .field > label.lbl { display:block; font-weight:600; margin-bottom:6px; font-size:.95rem; }
  .req { color:var(--err); }
  input[type=text], input[type=number], input[type=email], textarea {
    width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; color:var(--text);
  }
  textarea { min-height:90px; resize:vertical; }
  input[type=file] { width:100%; padding:8px; border:1px dashed var(--line); border-radius:6px; background:#fafbfc; font:inherit; }
  .opt { display:inline-flex; align-items:center; gap:6px; margin-right:18px; }
  .check { display:flex; align-items:flex-start; gap:8px; }
  .hint { color:var(--muted); font-size:.8rem; margin-top:4px; }
  .files { font-size:.82rem; color:var(--muted); margin-top:4px; }
  .error { outline:2px solid var(--err); outline-offset:3px; border-radius:6px; }
  .errmsg { color:var(--err); font-size:.82rem; margin-top:4px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 22px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  #status { margin-top:14px; font-size:.92rem; white-space:pre-wrap; }
  #bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:10px; display:none; }
  #bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .done { text-align:center; padding:30px 10px; }
  .foot { text-align:center; color:var(--muted); font-size:.85rem; padding:0 16px 28px; }
  :root { color-scheme: light; }
</style>
</head>

    {key:'daftar_proyek', label:'Daftar proyek', type:'textarea', req:false, showIf:['pernah_vendor','Ya'],
      hint:'Satu baris per proyek: Nama ISP/Klien – Lingkup pekerjaan – Lokasi – Periode – Nilai kontrak'},
    {key:'bukti_proyek', label:'Bukti proyek (SPK/kontrak, BAST, atau surat referensi)', type:'file', req:false, max:10, showIf:['pernah_vendor','Ya']},

  { title:'E. Tools dan Perangkat', desc:'Unggah foto alat beserta bukti kepemilikan/sewa.', fields:

      {key:'tool_file_'+i, label:t+' - foto dan bukti kepemilikan/sewa (opsional)', type:'file', req:false, max:5},

  },
  { title:'F. Kantor dan Gudang', fields:[
    {key:'alamat_kantor', label:'Alamat kantor', type:'textarea', req:false},
    {key:'status_kantor', label:'Status kantor', type:'radio', req:false, options:['Milik','Sewa']},
    {key:'bukti_sewa', label:'Bukti sewa', type:'file', req:false, max:3, showIf:['status_kantor','Sewa']},
    {key:'foto_kantor', label:'Foto kantor (opsional)', type:'file', req:false, max:5},
    {key:'foto_gudang', label:'Foto gudang (opsional)', type:'file', req:false, max:5},

    {key:'pic_lokasi', label:'Nama dan nomor HP PIC lokasi', type:'text', req:false},

// ====== RENDER ======
const form = document.getElementById('form');
const ALL = [];

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

SECTIONS.forEach(sec=>{
  const s = document.createElement('section');
  s.innerHTML = '<h2>'+esc(sec.title)+'</h2>' + (sec.desc ? '<p class="desc">'+esc(sec.desc)+'</p>' : '');
  sec.fields.forEach(f=>{
    ALL.push(f);
    const d = document.createElement('div');
    d.className = 'field'; d.id = 'f_'+f.key;
    const star = f.req ? ' <span class="req">*</span>' : '';
    let html = '';
    if (f.type === 'check') {
      html = '<label class="check"><input type="checkbox" id="i_'+f.key+'"><span>'+esc(f.label)+star+'</span></label>';
    } else {
      html = '<label class="lbl" for="i_'+f.key+'">'+esc(f.label)+star+'</label>';
      if (f.type === 'textarea') html += '<textarea id="i_'+f.key+'"></textarea>';
      else if (f.type === 'radio') html += f.options.map(o=>'<label class="opt"><input type="radio" name="r_'+f.key+'" value="'+esc(o)+'"> '+esc(o)+'</label>').join('');
      else if (f.type === 'file') html += '<input type="file" id="i_'+f.key+'" multiple accept=".pdf,image/*"><div class="files" id="n_'+f.key+'"></div><div class="hint">PDF/gambar, maks. '+(f.max||5)+' file, '+MAX_MB+' MB per file</div>';
      else html += '<input type="'+(f.type==='number'?'number" min="0':f.type)+'" id="i_'+f.key+'">';
    }
    if (f.hint && f.type !== 'file') html += '<div class="hint">'+esc(f.hint)+'</div>';
    html += '<div class="errmsg" id="e_'+f.key+'"></div>';
    d.innerHTML = html;
    s.appendChild(d);
  });
  form.appendChild(s);
});

// tampilkan nama file terpilih
ALL.filter(f=>f.type==='file').forEach(f=>{
  document.getElementById('i_'+f.key).addEventListener('change', e=>{
    document.getElementById('n_'+f.key).textContent = Array.from(e.target.files).map(x=>x.name).join(', ');
  });
});

// ====== LOGIKA ======
function getVal(f){
  if (f.type==='check') return document.getElementById('i_'+f.key).checked;
  if (f.type==='radio') { const r = form.querySelector('input[name="r_'+f.key+'"]:checked'); return r ? r.value : ''; }
  if (f.type==='file') return Array.from(document.getElementById('i_'+f.key).files);
  return document.getElementById('i_'+f.key).value.trim();
}
function isVisible(f){
  if (!f.showIf) return true;
  const dep = ALL.find(x=>x.key===f.showIf[0]);
  return getVal(dep) === f.showIf[1];
}
function refreshVisibility(){
  ALL.forEach(f=>{ document.getElementById('f_'+f.key).style.display = isVisible(f) ? '' : 'none'; });
}
form.addEventListener('change', refreshVisibility);
refreshVisibility();

function validate(){
  let first = null;
  ALL.forEach(f=>{
    const box = document.getElementById('f_'+f.key), msg = document.getElementById('e_'+f.key);
    box.classList.remove('error'); msg.textContent = '';
    if (!isVisible(f)) return;
    const v = getVal(f);
    let m = '';
    if (f.req) {
      if (f.type==='file' ? v.length===0 : (f.type==='check' ? !v : v==='')) m = 'Wajib diisi.';
    }
    if (!m && f.type==='email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) m = 'Format email tidak valid.';
    if (!m && f.type==='file') {
      if (v.length > (f.max||5)) m = 'Maksimal '+(f.max||5)+' file.';
      else if (v.some(x=>x.size > MAX_MB*1024*1024)) m = 'Ada file lebih dari '+MAX_MB+' MB.';
    }
    if (m) { box.classList.add('error'); msg.textContent = m; if (!first) first = box; }
  });
  if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
  return !first;
}

// ====== KIRIM ======
// Ganti dengan URL web app Apps Script (berakhiran /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbzgtJGk6tMsmPRP1PjnwGgn7droufJj_cdxnavSYs0MTkrkrYLkloQY1vrsQgzrRM2t/exec';
const run = async (fn, ...args) => {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: fn, args: args})
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Permintaan gagal');
  return j.result;
};

const toB64 = file => new Promise((res, rej)=>{
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.onerror = () => rej(new Error('Gagal membaca file '+file.name));
  r.readAsDataURL(file);
});

const statusEl = document.getElementById('status'), bar = document.getElementById('bar'), btn = document.getElementById('submit');
function setProgress(p, text){ bar.style.display='block'; bar.firstElementChild.style.width = p+'%'; statusEl.textContent = text; }

btn.addEventListener('click', async ()=>{
  if (!validate()) { statusEl.textContent = 'Masih ada kolom yang belum lengkap. Periksa kolom bertanda merah.'; return; }
  btn.disabled = true;
  try {
    const vis = ALL.filter(isVisible);
    const jobs = [];
    vis.filter(f=>f.type==='file').forEach(f=>getVal(f).forEach(file=>jobs.push({f, file})));
    const total = jobs.length + 2; let done = 0;

    setProgress(2, 'Menyiapkan folder...');
    const sub = await run('createSubmission', getVal(ALL.find(x=>x.key==='nama_perusahaan')));
    done++;

    const links = {};
    for (const j of jobs) {
      setProgress(Math.round(done/total*100), 'Mengunggah ('+(done)+'/'+(jobs.length)+'): '+j.file.name);
      const b64 = await toB64(j.file);
      const url = await run('uploadFile', sub.id, j.f.label, j.file.name, j.file.type, b64);
      (links[j.f.key] = links[j.f.key] || []).push(url);
      done++;
    }

    setProgress(95, 'Menyimpan data...');
    const data = {};
    vis.forEach(f=>{
      const v = getVal(f);
      if (f.type==='file') data[f.label] = (links[f.key]||[]).join('\n');
      else if (f.type==='check') data[f.label] = v ? 'Ya' : 'Tidak';
      else data[f.label] = v;
    });
    await run('finalize', sub.url, data);

    document.getElementById('app').innerHTML =
      '<div class="wrap"><section class="done"><h2>Terima kasih</h2><p>Pendaftaran Anda sudah kami terima. Tim kami akan menghubungi PIC melalui kontak yang dicantumkan.</p></section></div>';
  } catch (err) {
    statusEl.textContent = 'Gagal mengirim: ' + err.message + '\nSilakan coba lagi.';
    btn.disabled = false;
  }
});
</script>
